<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="gi1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0071E3"/>
      <stop offset="100%" style="stop-color:#00C6FF"/>
    </linearGradient>
    <linearGradient id="gi2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#5856D6"/>
      <stop offset="100%" style="stop-color:#0071E3"/>
    </linearGradient>
    <linearGradient id="gi3" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00C6FF"/>
      <stop offset="100%" style="stop-color:#34C759"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="120" height="120" rx="26" fill="#FFFFFF"/>

  <g transform="translate(60,60)">
    <!-- Three orbital rings -->
    <ellipse cx="0" cy="0" rx="40" ry="14" fill="none" stroke="url(#gi1)" stroke-width="2.5" opacity="0.55" transform="rotate(-30)"/>
    <ellipse cx="0" cy="0" rx="40" ry="14" fill="none" stroke="url(#gi2)" stroke-width="2.5" opacity="0.55" transform="rotate(30)"/>
    <ellipse cx="0" cy="0" rx="40" ry="14" fill="none" stroke="url(#gi3)" stroke-width="2.5" opacity="0.55" transform="rotate(90)"/>

    <!-- Three team nodes -->
    <circle cx="0" cy="-40" r="8" fill="#0071E3"/>
    <circle cx="-35" cy="20" r="8" fill="#5856D6"/>
    <circle cx="35" cy="20" r="8" fill="#00C6FF"/>

    <!-- Central core -->
    <circle cx="0" cy="0" r="7" fill="url(#gi1)" opacity="0.3"/>
    <circle cx="0" cy="0" r="3.5" fill="url(#gi1)" opacity="0.7"/>
  </g>
</svg>
