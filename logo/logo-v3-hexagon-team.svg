<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="g3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0071E3"/>
      <stop offset="50%" style="stop-color:#5856D6"/>
      <stop offset="100%" style="stop-color:#00C6FF"/>
    </linearGradient>
  </defs>
  <rect width="500" height="500" fill="#FFFFFF"/>

  <g transform="translate(250,185)">
    <!-- Main hexagon outline -->
    <polygon points="0,-85 73.6,-42.5 73.6,42.5 0,85 -73.6,42.5 -73.6,-42.5" 
             fill="none" stroke="url(#g3)" stroke-width="3" opacity="0.25"/>
    
    <!-- Inner hexagon -->
    <polygon points="0,-50 43.3,-25 43.3,25 0,50 -43.3,25 -43.3,-25" 
             fill="url(#g3)" opacity="0.08"/>

    <!-- 6 team member dots on hexagon vertices -->
    <circle cx="0" cy="-85" r="12" fill="#0071E3" opacity="0.9"/>
    <circle cx="73.6" cy="-42.5" r="12" fill="#0059B3" opacity="0.8"/>
    <circle cx="73.6" cy="42.5" r="12" fill="#5856D6" opacity="0.8"/>
    <circle cx="0" cy="85" r="12" fill="#00C6FF" opacity="0.9"/>
    <circle cx="-73.6" cy="42.5" r="12" fill="#34C759" opacity="0.8"/>
    <circle cx="-73.6" cy="-42.5" r="12" fill="#0071E3" opacity="0.8"/>

    <!-- People icons inside dots -->
    <g fill="white" opacity="0.9">
      <circle cx="0" cy="-89" r="3.5"/><ellipse cx="0" cy="-81" rx="5.5" ry="4"/>
      <circle cx="73.6" cy="-46.5" r="3.5"/><ellipse cx="73.6" cy="-38.5" rx="5.5" ry="4"/>
      <circle cx="73.6" cy="38.5" r="3.5"/><ellipse cx="73.6" cy="46.5" rx="5.5" ry="4"/>
      <circle cx="0" cy="81" r="3.5"/><ellipse cx="0" cy="89" rx="5.5" ry="4"/>
      <circle cx="-73.6" cy="38.5" r="3.5"/><ellipse cx="-73.6" cy="46.5" rx="5.5" ry="4"/>
      <circle cx="-73.6" cy="-46.5" r="3.5"/><ellipse cx="-73.6" cy="-38.5" rx="5.5" ry="4"/>
    </g>

    <!-- Cross connections (teamwork mesh) -->
    <line x1="0" y1="-85" x2="0" y2="85" stroke="url(#g3)" stroke-width="1" opacity="0.15"/>
    <line x1="-73.6" y1="-42.5" x2="73.6" y2="42.5" stroke="url(#g3)" stroke-width="1" opacity="0.15"/>
    <line x1="-73.6" y1="42.5" x2="73.6" y2="-42.5" stroke="url(#g3)" stroke-width="1" opacity="0.15"/>

    <!-- Central AI core -->
    <circle cx="0" cy="0" r="15" fill="url(#g3)" opacity="0.2"/>
    <circle cx="0" cy="0" r="8" fill="url(#g3)" opacity="0.4"/>
    <text x="0" y="4" text-anchor="middle" font-family="'Inter',sans-serif" font-size="10" font-weight="700" fill="white" opacity="0.9">AI</text>
  </g>

  <text x="250" y="345" text-anchor="middle" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="58" font-weight="700" fill="#1D1D1F" letter-spacing="-1">
    Micro<tspan fill="url(#g3)" font-weight="800">SIS</tspan>
  </text>
  <text x="250" y="375" text-anchor="middle" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="500" fill="#6E6E73" letter-spacing="4">
    INTELLIGENT SOLUTIONS, TOGETHER
  </text>
  <text x="250" y="470" text-anchor="middle" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#AAAAAA">
    CONCEPT 3 — HEXAGON TEAM
  </text>
</svg>
