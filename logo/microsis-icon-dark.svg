<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="gd1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0071E3"/>
      <stop offset="100%" style="stop-color:#00C6FF"/>
    </linearGradient>
    <linearGradient id="gd2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#5856D6"/>
      <stop offset="100%" style="stop-color:#0071E3"/>
    </linearGradient>
    <linearGradient id="gd3" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00C6FF"/>
      <stop offset="100%" style="stop-color:#34C759"/>
    </linearGradient>
  </defs>

  <!-- Dark background -->
  <rect width="120" height="120" rx="26" fill="#1D1D1F"/>

  <g transform="translate(60,60)">
    <ellipse cx="0" cy="0" rx="40" ry="14" fill="none" stroke="url(#gd1)" stroke-width="2.5" opacity="0.6" transform="rotate(-30)"/>
    <ellipse cx="0" cy="0" rx="40" ry="14" fill="none" stroke="url(#gd2)" stroke-width="2.5" opacity="0.6" transform="rotate(30)"/>
    <ellipse cx="0" cy="0" rx="40" ry="14" fill="none" stroke="url(#gd3)" stroke-width="2.5" opacity="0.6" transform="rotate(90)"/>

    <circle cx="0" cy="-40" r="8" fill="#0071E3"/>
    <circle cx="-35" cy="20" r="8" fill="#5856D6"/>
    <circle cx="35" cy="20" r="8" fill="#00C6FF"/>

    <circle cx="0" cy="0" r="7" fill="url(#gd1)" opacity="0.35"/>
    <circle cx="0" cy="0" r="3.5" fill="url(#gd1)" opacity="0.8"/>
  </g>
</svg>
