<svg xmlns="http://www.w3.org/2000/svg" viewBox="8 12 400 96" width="400" height="96">
  <defs>
    <linearGradient id="gf1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0071E3"/>
      <stop offset="100%" style="stop-color:#00C6FF"/>
    </linearGradient>
    <linearGradient id="gf2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#5856D6"/>
      <stop offset="100%" style="stop-color:#0071E3"/>
    </linearGradient>
    <linearGradient id="gf3" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00C6FF"/>
      <stop offset="100%" style="stop-color:#34C759"/>
    </linearGradient>
  </defs>

  <!-- Icon Mark -->
  <g transform="translate(52,60)">
    <!-- Three clean orbital rings -->
    <ellipse cx="0" cy="0" rx="40" ry="14.5" fill="none" stroke="url(#gf1)" stroke-width="2.8" opacity="0.82" transform="rotate(-30)"/>
    <ellipse cx="0" cy="0" rx="40" ry="14.5" fill="none" stroke="url(#gf2)" stroke-width="2.8" opacity="0.82" transform="rotate(30)"/>
    <ellipse cx="0" cy="0" rx="40" ry="14.5" fill="none" stroke="url(#gf3)" stroke-width="2.8" opacity="0.82" transform="rotate(90)"/>

    <!-- Three team nodes -->
    <circle cx="0" cy="-40" r="7.5" fill="#0071E3"/>
    <circle cx="-34.5" cy="20" r="7.5" fill="#5856D6"/>
    <circle cx="34.5" cy="20" r="7.5" fill="#00C6FF"/>

    <!-- Central AI core -->
    <circle cx="0" cy="0" r="8" fill="url(#gf1)" opacity="0.35"/>
    <circle cx="0" cy="0" r="4.2" fill="url(#gf1)" opacity="0.95"/>
  </g>

  <!-- Company Name -->
  <text x="104" y="75" textLength="282" lengthAdjust="spacingAndGlyphs" font-family="'Inter','SF Pro Display',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="48" font-weight="800" fill="#1D1D1F" letter-spacing="-1.2">
    Micro<tspan fill="url(#gf1)" font-weight="800">SIS</tspan><tspan font-size="27" font-weight="600" fill="#515154">.ai</tspan>
  </text>
</svg>
