<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D1117"/>
      <stop offset="100%" style="stop-color:#0D1F3C"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5C842"/>
      <stop offset="100%" style="stop-color:#E8A020"/>
    </linearGradient>
    <linearGradient id="blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0071E3"/>
      <stop offset="100%" style="stop-color:#00C6FF"/>
    </linearGradient>
    <linearGradient id="purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5856D6"/>
      <stop offset="100%" style="stop-color:#9B59B6"/>
    </linearGradient>
    <linearGradient id="red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF3B30"/>
      <stop offset="100%" style="stop-color:#FF9500"/>
    </linearGradient>
    <linearGradient id="pink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF2D55"/>
      <stop offset="100%" style="stop-color:#FF6B9D"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34C759"/>
      <stop offset="100%" style="stop-color:#30D158"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00C6FF"/>
      <stop offset="100%" style="stop-color:#00E5CC"/>
    </linearGradient>
    <!-- Glow filters -->
    <filter id="glow-gold">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-blue">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="rgba(0,0,0,0.5)"/>
    </filter>
    <!-- Grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E3A5F" stroke-width="0.5" opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect width="1200" height="800" fill="url(#grid)"/>

  <!-- Subtle outer glow ring around center -->
  <circle cx="600" cy="390" r="240" fill="none" stroke="#F5C842" stroke-width="1" opacity="0.08"/>
  <circle cx="600" cy="390" r="195" fill="none" stroke="#F5C842" stroke-width="1" opacity="0.05"/>

  <!-- Connection lines from Drona to each agent -->
  <!-- Arjuna (top) -->
  <line x1="600" y1="295" x2="600" y2="175" stroke="url(#blue)" stroke-width="2" opacity="0.6"/>
  <circle cx="600" cy="235" r="3" fill="#00C6FF" opacity="0.8"/>

  <!-- Krishna (top-right) -->
  <line x1="668" y1="332" x2="820" y2="245" stroke="url(#purple)" stroke-width="2" opacity="0.6"/>
  <circle cx="744" cy="288" r="3" fill="#9B59B6" opacity="0.8"/>

  <!-- Bheem (bottom-right) -->
  <line x1="668" y1="448" x2="820" y2="535" stroke="url(#red)" stroke-width="2" opacity="0.6"/>
  <circle cx="744" cy="491" r="3" fill="#FF9500" opacity="0.8"/>

  <!-- Sahadeva (bottom) -->
  <line x1="600" y1="485" x2="600" y2="605" stroke="url(#cyan)" stroke-width="2" opacity="0.6"/>
  <circle cx="600" cy="545" r="3" fill="#00E5CC" opacity="0.8"/>

  <!-- Vidura (bottom-left) -->
  <line x1="532" y1="448" x2="380" y2="535" stroke="url(#green)" stroke-width="2" opacity="0.6"/>
  <circle cx="456" cy="491" r="3" fill="#34C759" opacity="0.8"/>

  <!-- Draupadi (top-left) -->
  <line x1="532" y1="332" x2="380" y2="245" stroke="url(#pink)" stroke-width="2" opacity="0.6"/>
  <circle cx="456" cy="288" r="3" fill="#FF6B9D" opacity="0.8"/>

  <!-- ===== DRONA (Center) ===== -->
  <g transform="translate(600, 390)" filter="url(#glow-gold)">
    <!-- Hexagon -->
    <polygon points="0,-80 69,-40 69,40 0,80 -69,40 -69,-40" fill="#0D1F3C" stroke="url(#gold)" stroke-width="3"/>
    <polygon points="0,-72 62,-36 62,36 0,72 -62,36 -62,-36" fill="rgba(245,200,66,0.08)"/>
    <!-- Icon -->
    <text text-anchor="middle" y="-18" font-size="32">🏹</text>
    <!-- Name -->
    <text text-anchor="middle" y="16" font-family="'Segoe UI',Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#F5C842">DRONA</text>
    <!-- Role -->
    <text text-anchor="middle" y="34" font-family="'Segoe UI',Inter,Arial,sans-serif" font-size="10" font-weight="500" fill="#A0A8B8">AI Guru · Orchestrator</text>
  </g>

  <!-- ===== ARJUNA (Top) ===== -->
  <g transform="translate(600, 120)" filter="url(#shadow)">
    <polygon points="0,-60 52,-30 52,30 0,60 -52,30 -52,-30" fill="#0D1F3C" stroke="url(#blue)" stroke-width="2.5"/>
    <polygon points="0,-52 45,-26 45,26 0,52 -45,26 -45,-26" fill="rgba(0,113,227,0.08)"/>
    <text text-anchor="middle" y="-10" font-size="24">🎯</text>
    <text text-anchor="middle" y="14" font-family="'Segoe UI',Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#00C6FF">ARJUNA</text>
    <text text-anchor="middle" y="28" font-family="'Segoe UI',Inter,Arial,sans-serif" font-size="9" fill="#6E8AA8">Precision Executor</text>
    <text text-anchor="middle" y="40" font-family="'Segoe UI',Inter,Arial,sans-serif" font-size="8" fill="#4A6A88">Code · Analysis</text>
  </g>

  <!-- ===== KRISHNA (Top-Right) ===== -->
  <g transform="translate(880, 210)" filter="url(#shadow)">
    <polygon points="0,-60 52,-30 52,30 0,60 -52,30 -52,-30" fill="#0D1F3C" stroke="url(#purple)" stroke-width="2.5"/>
    <polygon points="0,-52 45,-26 45,26 0,52 -45,26 -45,-26" fill="rgba(88,86,214,0.08)"/>
    <text text-anchor="middle" y="-10" font-size="24">🪈</text>
    <text text-anchor="middle" y="14" font-family="'Segoe UI',Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#9B59B6">KRISHNA</text>
    <text text-anchor="middle" y="28" font-family="'Segoe UI',Inter,Arial,sans-serif" font-size="9" fill="#6E5A8A">Strategic Advisor</text>
    <text text-anchor="middle" y="40" font-family="'Segoe UI',Inter,Arial,sans-serif" font-size="8" fill="#4A3A6A">Planning · Strategy</text>
  </g>

  <!-- ===== BHEEM (Bottom-Right) ===== -->
  <g transform="translate(880, 570)" filter="url(#shadow)">
    <polygon points="0,-60 52,-30 52,30 0,60 -52,30 -52,-30" fill="#0D1F3C" stroke="url(#red)" stroke-width="2.5"/>
    <polygon points="0,-52 45,-26 45,26 0,52 -45,26 -45,-26" fill="rgba(255,59,48,0.08)"/>
    <text text-anchor="middle" y="-10" font-size="24">💪</text>
    <text text-anchor="middle" y="14" font-family="'Segoe UI',Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#FF9500">BHEEM</text>
    <text text-anchor="middle" y="28" font-family="'Segoe UI',Inter,Arial,sans-serif" font-size="9" fill="#8A6A3A">Heavy Lifter</text>
    <text text-anchor="middle" y="40" font-family="'Segoe UI',Inter,Arial,sans-serif" font-size="8" fill="#6A4A2A">Bulk Ops · Deployments</text>
  </g>

  <!-- ===== SAHADEVA (Bottom) ===== -->
  <g transform="translate(600, 660)" filter="url(#shadow)">
    <polygon points="0,-60 52,-30 52,30 0,60 -52,30 -52,-30" fill="#0D1F3C" stroke="url(#cyan)" stroke-width="2.5"/>
    <polygon points="0,-52 45,-26 45,26 0,52 -45,26 -45,-26" fill="rgba(0,198,255,0.08)"/>
    <text text-anchor="middle" y="-10" font-size="24">🔮</text>
    <text text-anchor="middle" y="14" font-family="'Segoe UI',Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#00E5CC">SAHADEVA</text>
    <text text-anchor="middle" y="28" font-family="'Segoe UI',Inter,Arial,sans-serif" font-size="9" fill="#3A8A88">The Seer</text>
    <text text-anchor="middle" y="40" font-family="'Segoe UI',Inter,Arial,sans-serif" font-size="8" fill="#2A6A68">Monitoring · Analytics</text>
  </g>

  <!-- ===== VIDURA (Bottom-Left) ===== -->
  <g transform="translate(320, 570)" filter="url(#shadow)">
    <polygon points="0,-60 52,-30 52,30 0,60 -52,30 -52,-30" fill="#0D1F3C" stroke="url(#green)" stroke-width="2.5"/>
    <polygon points="0,-52 45,-26 45,26 0,52 -45,26 -45,-26" fill="rgba(52,199,89,0.08)"/>
    <text text-anchor="middle" y="-10" font-size="24">🧠</text>
    <text text-anchor="middle" y="14" font-family="'Segoe UI',Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#34C759">VIDURA</text>
    <text text-anchor="middle" y="28" font-family="'Segoe UI',Inter,Arial,sans-serif" font-size="9" fill="#3A7A4A">Wise Counsel</text>
    <text text-anchor="middle" y="40" font-family="'Segoe UI',Inter,Arial,sans-serif" font-size="8" fill="#2A5A3A">Compliance · Security</text>
  </g>

  <!-- ===== DRAUPADI (Top-Left) ===== -->
  <g transform="translate(320, 210)" filter="url(#shadow)">
    <polygon points="0,-60 52,-30 52,30 0,60 -52,30 -52,-30" fill="#0D1F3C" stroke="url(#pink)" stroke-width="2.5"/>
    <polygon points="0,-52 45,-26 45,26 0,52 -45,26 -45,-26" fill="rgba(255,45,85,0.08)"/>
    <text text-anchor="middle" y="-10" font-size="24">🔥</text>
    <text text-anchor="middle" y="14" font-family="'Segoe UI',Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#FF6B9D">DRAUPADI</text>
    <text text-anchor="middle" y="28" font-family="'Segoe UI',Inter,Arial,sans-serif" font-size="9" fill="#8A4A68">Communicator</text>
    <text text-anchor="middle" y="40" font-family="'Segoe UI',Inter,Arial,sans-serif" font-size="8" fill="#6A2A48">Content · Marketing</text>
  </g>

  <!-- ===== OpenClaw badge (top right) ===== -->
  <g transform="translate(1100, 40)">
    <rect x="-90" y="-18" width="150" height="28" rx="14" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text text-anchor="middle" y="5" font-family="'Segoe UI',Inter,Arial,sans-serif" font-size="11" fill="#6E8AA8">Powered by OpenClaw</text>
  </g>

  <!-- ===== Header ===== -->
  <text x="600" y="42" text-anchor="middle" font-family="'Segoe UI',Inter,Arial,sans-serif" font-size="28" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">MicroSIS AI Agent Council</text>
  <text x="600" y="66" text-anchor="middle" font-family="'Segoe UI',Inter,Arial,sans-serif" font-size="13" fill="#6E8AA8" letter-spacing="2">MAHABHARATA-INSPIRED MULTI-AGENT SYSTEM</text>

  <!-- ===== Footer ===== -->
  <rect x="0" y="750" width="1200" height="50" fill="rgba(0,0,0,0.3)"/>
  <!-- MicroSIS logo text -->
  <text x="600" y="782" text-anchor="middle" font-family="'Segoe UI',Inter,Arial,sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Micro<tspan fill="#0071E3">SIS</tspan><tspan font-weight="400" fill="#6E8AA8" font-size="15">.ai</tspan></text>
  <text x="600" y="796" text-anchor="middle" font-family="'Segoe UI',Inter,Arial,sans-serif" font-size="10" fill="#4A6A88" letter-spacing="3">INTELLIGENT SOLUTIONS, TOGETHER</text>
</svg>
