<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0B0C10"/>
      <stop offset="100%" style="stop-color:#12151E"/>
    </linearGradient>
    <linearGradient id="accentBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2997FF"/>
      <stop offset="100%" style="stop-color:#0071E3"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Canvas -->
  <rect width="1200" height="760" fill="url(#bg)"/>
  <rect width="1200" height="760" fill="url(#grid)"/>

  <!-- Concentric Orbital Rings -->
  <circle cx="600" cy="390" r="250" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1" stroke-dasharray="4 6"/>
  <circle cx="600" cy="390" r="165" fill="none" stroke="rgba(41,151,255,0.16)" stroke-width="1"/>

  <!-- Radial Bus Connections -->
  <line x1="600" y1="310" x2="600" y2="195" stroke="rgba(41,151,255,0.45)" stroke-width="1.5"/>
  <line x1="668" y1="350" x2="806" y2="270" stroke="rgba(41,151,255,0.45)" stroke-width="1.5"/>
  <line x1="668" y1="430" x2="806" y2="510" stroke="rgba(41,151,255,0.45)" stroke-width="1.5"/>
  <line x1="600" y1="470" x2="600" y2="585" stroke="rgba(41,151,255,0.45)" stroke-width="1.5"/>
  <line x1="532" y1="430" x2="394" y2="510" stroke="rgba(41,151,255,0.45)" stroke-width="1.5"/>
  <line x1="532" y1="350" x2="394" y2="270" stroke="rgba(41,151,255,0.45)" stroke-width="1.5"/>

  <!-- Header -->
  <text x="600" y="54" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display',Inter,sans-serif" font-size="22" font-weight="600" fill="#F5F5F7" letter-spacing="-0.4">OpenClaw Multi-Agent Topology</text>
  <text x="600" y="78" text-anchor="middle" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="11" fill="#86868B" letter-spacing="1.5">DETERMINISTIC CONSENSUS &amp; POLICY VERIFICATION</text>

  <!-- 01. DRONA (Center Orchestrator) -->
  <g transform="translate(600, 390)">
    <circle r="76" fill="#161821" stroke="url(#accentBlue)" stroke-width="2"/>
    <circle r="64" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text text-anchor="middle" y="-22" font-family="ui-monospace,'SF Mono',monospace" font-size="11" font-weight="600" fill="#2997FF">NODE 01</text>
    <text text-anchor="middle" y="4" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display',Inter,sans-serif" font-size="20" font-weight="700" fill="#F5F5F7" letter-spacing="-0.3">DRONA</text>
    <text text-anchor="middle" y="24" font-family="-apple-system,BlinkMacSystemFont,Inter,sans-serif" font-size="11" fill="#A1A1A6">Master Orchestrator</text>
    <text text-anchor="middle" y="40" font-family="ui-monospace,'SF Mono',monospace" font-size="9.5" fill="#6E6E73">Intent &amp; Consensus</text>
  </g>

  <!-- 02. ARJUNA (Top) -->
  <g transform="translate(600, 140)">
    <rect x="-88" y="-48" width="176" height="96" rx="18" fill="#161821" stroke="rgba(255,255,255,0.16)" stroke-width="1.5"/>
    <text text-anchor="middle" y="-18" font-family="ui-monospace,'SF Mono',monospace" font-size="10" font-weight="600" fill="#2997FF">02 · DOCMIND</text>
    <text text-anchor="middle" y="4" font-family="-apple-system,BlinkMacSystemFont,Inter,sans-serif" font-size="16" font-weight="600" fill="#F5F5F7">Arjuna</text>
    <text text-anchor="middle" y="24" font-family="-apple-system,BlinkMacSystemFont,Inter,sans-serif" font-size="11" fill="#86868B">Precision Schema Execution</text>
  </g>

  <!-- 03. KRISHNA (Top-Right) -->
  <g transform="translate(866, 236)">
    <rect x="-88" y="-48" width="176" height="96" rx="18" fill="#161821" stroke="rgba(255,255,255,0.16)" stroke-width="1.5"/>
    <text text-anchor="middle" y="-18" font-family="ui-monospace,'SF Mono',monospace" font-size="10" font-weight="600" fill="#2997FF">03 · STRATEGY</text>
    <text text-anchor="middle" y="4" font-family="-apple-system,BlinkMacSystemFont,Inter,sans-serif" font-size="16" font-weight="600" fill="#F5F5F7">Krishna</text>
    <text text-anchor="middle" y="24" font-family="-apple-system,BlinkMacSystemFont,Inter,sans-serif" font-size="11" fill="#86868B">Horizon &amp; Policy Planning</text>
  </g>

  <!-- 04. BHEEM (Bottom-Right) -->
  <g transform="translate(866, 544)">
    <rect x="-88" y="-48" width="176" height="96" rx="18" fill="#161821" stroke="rgba(255,255,255,0.16)" stroke-width="1.5"/>
    <text text-anchor="middle" y="-18" font-family="ui-monospace,'SF Mono',monospace" font-size="10" font-weight="600" fill="#2997FF">04 · COMPUTE</text>
    <text text-anchor="middle" y="4" font-family="-apple-system,BlinkMacSystemFont,Inter,sans-serif" font-size="16" font-weight="600" fill="#F5F5F7">Bheem</text>
    <text text-anchor="middle" y="24" font-family="-apple-system,BlinkMacSystemFont,Inter,sans-serif" font-size="11" fill="#86868B">Batch &amp; Edge Containment</text>
  </g>

  <!-- 05. SAHADEVA (Bottom) -->
  <g transform="translate(600, 640)">
    <rect x="-88" y="-48" width="176" height="96" rx="18" fill="#161821" stroke="rgba(255,255,255,0.16)" stroke-width="1.5"/>
    <text text-anchor="middle" y="-18" font-family="ui-monospace,'SF Mono',monospace" font-size="10" font-weight="600" fill="#2997FF">05 · PREDICTFLOW</text>
    <text text-anchor="middle" y="4" font-family="-apple-system,BlinkMacSystemFont,Inter,sans-serif" font-size="16" font-weight="600" fill="#F5F5F7">Sahadeva</text>
    <text text-anchor="middle" y="24" font-family="-apple-system,BlinkMacSystemFont,Inter,sans-serif" font-size="11" fill="#86868B">Temporal &amp; SHAP Modeling</text>
  </g>

  <!-- 06. VIDURA (Bottom-Left) -->
  <g transform="translate(334, 544)">
    <rect x="-88" y="-48" width="176" height="96" rx="18" fill="#161821" stroke="rgba(255,255,255,0.16)" stroke-width="1.5"/>
    <text text-anchor="middle" y="-18" font-family="ui-monospace,'SF Mono',monospace" font-size="10" font-weight="600" fill="#2997FF">06 · COMPLIANCE &amp; GUARDNET</text>
    <text text-anchor="middle" y="4" font-family="-apple-system,BlinkMacSystemFont,Inter,sans-serif" font-size="16" font-weight="600" fill="#F5F5F7">Vidura</text>
    <text text-anchor="middle" y="24" font-family="-apple-system,BlinkMacSystemFont,Inter,sans-serif" font-size="11" fill="#86868B">Governance &amp; Inline Veto</text>
  </g>

  <!-- 07. DRAUPADI (Top-Left) -->
  <g transform="translate(334, 236)">
    <rect x="-88" y="-48" width="176" height="96" rx="18" fill="#161821" stroke="rgba(255,255,255,0.16)" stroke-width="1.5"/>
    <text text-anchor="middle" y="-18" font-family="ui-monospace,'SF Mono',monospace" font-size="10" font-weight="600" fill="#2997FF">07 · VOICEFORGE</text>
    <text text-anchor="middle" y="4" font-family="-apple-system,BlinkMacSystemFont,Inter,sans-serif" font-size="16" font-weight="600" fill="#F5F5F7">Draupadi</text>
    <text text-anchor="middle" y="24" font-family="-apple-system,BlinkMacSystemFont,Inter,sans-serif" font-size="11" fill="#86868B">Acoustic &amp; Linguistic Stream</text>
  </g>
</svg>
