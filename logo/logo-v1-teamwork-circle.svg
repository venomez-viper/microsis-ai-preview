<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0071E3"/>
      <stop offset="100%" style="stop-color:#00C6FF"/>
    </linearGradient>
    <linearGradient id="g1b" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#5856D6"/>
      <stop offset="100%" style="stop-color:#00C6FF"/>
    </linearGradient>
  </defs>

  <rect width="500" height="500" fill="#FFFFFF"/>

  <!-- Concept 1: Three people in a circle forming unity -->
  <g transform="translate(250,200)">
    <!-- Outer ring -->
    <circle cx="0" cy="0" r="105" fill="none" stroke="url(#g1)" stroke-width="3" opacity="0.2"/>
    
    <!-- Top person (blue) -->
    <g transform="translate(0,-65)">
      <circle cx="0" cy="-18" r="16" fill="#0071E3"/>
      <path d="M0 0 C-18 0 -28 14 -28 28 L-28 35 C-28 38 -26 40 -23 40 L23 40 C26 40 28 38 28 35 L28 28 C28 14 18 0 0 0Z" fill="#0071E3" opacity="0.8"/>
    </g>

    <!-- Bottom-left person (purple) -->
    <g transform="translate(-60,40)">
      <circle cx="0" cy="-18" r="16" fill="#5856D6"/>
      <path d="M0 0 C-18 0 -28 14 -28 28 L-28 35 C-28 38 -26 40 -23 40 L23 40 C26 40 28 38 28 35 L28 28 C28 14 18 0 0 0Z" fill="#5856D6" opacity="0.8"/>
    </g>

    <!-- Bottom-right person (cyan) -->
    <g transform="translate(60,40)">
      <circle cx="0" cy="-18" r="16" fill="#00C6FF"/>
      <path d="M0 0 C-18 0 -28 14 -28 28 L-28 35 C-28 38 -26 40 -23 40 L23 40 C26 40 28 38 28 35 L28 28 C28 14 18 0 0 0Z" fill="#00C6FF" opacity="0.8"/>
    </g>

    <!-- Connection lines between people -->
    <line x1="0" y1="-45" x2="-45" y2="25" stroke="url(#g1)" stroke-width="2" opacity="0.35" stroke-dasharray="5,4"/>
    <line x1="0" y1="-45" x2="45" y2="25" stroke="url(#g1)" stroke-width="2" opacity="0.35" stroke-dasharray="5,4"/>
    <line x1="-45" y1="25" x2="45" y2="25" stroke="url(#g1)" stroke-width="2" opacity="0.35" stroke-dasharray="5,4"/>

    <!-- Central AI node -->
    <circle cx="0" cy="5" r="8" fill="url(#g1)" opacity="0.25"/>
    <circle cx="0" cy="5" r="4" fill="url(#g1)" opacity="0.5"/>
  </g>

  <!-- Text -->
  <text x="250" y="360" text-anchor="middle" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="58" font-weight="700" fill="#1D1D1F" letter-spacing="-1">
    Micro<tspan fill="url(#g1)" font-weight="800">SIS</tspan>
  </text>
  <text x="250" y="390" text-anchor="middle" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="500" fill="#6E6E73" letter-spacing="4">
    INTELLIGENT SOLUTIONS, TOGETHER
  </text>

  <!-- Label -->
  <text x="250" y="470" text-anchor="middle" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#AAAAAA">
    CONCEPT 1 — TEAMWORK CIRCLE
  </text>
</svg>
