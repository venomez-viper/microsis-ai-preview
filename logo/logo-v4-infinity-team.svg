<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="g4a" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" style="stop-color:#0071E3"/>
      <stop offset="50%" style="stop-color:#5856D6"/>
      <stop offset="100%" style="stop-color:#00C6FF"/>
    </linearGradient>
    <linearGradient id="g4b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0071E3"/>
      <stop offset="100%" style="stop-color:#00C6FF"/>
    </linearGradient>
  </defs>

  <rect width="500" height="500" fill="#FFFFFF"/>

  <g transform="translate(250,185)">
    <!-- Infinity loop - represents infinite collaboration -->
    <path d="M0 0 C-20 -45 -70 -55 -90 -30 C-115 0 -90 40 -55 40 C-30 40 -15 20 0 0 C15 -20 30 -40 55 -40 C90 -40 115 0 90 30 C70 55 20 45 0 0Z" 
          fill="none" stroke="url(#g4a)" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
    
    <!-- Second offset loop for depth -->
    <path d="M0 0 C-20 -45 -70 -55 -90 -30 C-115 0 -90 40 -55 40 C-30 40 -15 20 0 0 C15 -20 30 -40 55 -40 C90 -40 115 0 90 30 C70 55 20 45 0 0Z" 
          fill="none" stroke="url(#g4a)" stroke-width="2" stroke-linecap="round" opacity="0.2" transform="scale(1.15)"/>

    <!-- Team member nodes along the infinity path -->
    <!-- Left loop - top -->
    <circle cx="-72" cy="-42" r="12" fill="#0071E3" opacity="0.9"/>
    <circle cx="-72" cy="-48" r="5" fill="#FFF" opacity="0.9"/>
    <rect x="-78" y="-40" width="12" height="7" rx="3" fill="#FFF" opacity="0.7"/>

    <!-- Left loop - bottom -->
    <circle cx="-60" cy="32" r="12" fill="#5856D6" opacity="0.9"/>
    <circle cx="-60" cy="26" r="5" fill="#FFF" opacity="0.9"/>
    <rect x="-66" y="34" width="12" height="7" rx="3" fill="#FFF" opacity="0.7"/>

    <!-- Center crossing -->
    <circle cx="0" cy="0" r="14" fill="url(#g4b)" opacity="0.9"/>
    <circle cx="0" cy="-6" r="5.5" fill="#FFF" opacity="0.9"/>
    <rect x="-7" y="1" width="14" height="8" rx="3.5" fill="#FFF" opacity="0.7"/>

    <!-- Right loop - top -->
    <circle cx="60" cy="-32" r="12" fill="#00C6FF" opacity="0.9"/>
    <circle cx="60" cy="-38" r="5" fill="#FFF" opacity="0.9"/>
    <rect x="54" y="-30" width="12" height="7" rx="3" fill="#FFF" opacity="0.7"/>

    <!-- Right loop - bottom -->
    <circle cx="72" cy="38" r="12" fill="#0071E3" opacity="0.8"/>
    <circle cx="72" cy="32" r="5" fill="#FFF" opacity="0.9"/>
    <rect x="66" y="40" width="12" height="7" rx="3" fill="#FFF" opacity="0.7"/>

    <!-- Sparkle dots -->
    <circle cx="-95" cy="-15" r="2.5" fill="#0071E3" opacity="0.3"/>
    <circle cx="95" cy="15" r="2.5" fill="#00C6FF" opacity="0.3"/>
    <circle cx="0" cy="-28" r="2" fill="#5856D6" opacity="0.25"/>
  </g>

  <!-- Text -->
  <text x="250" y="350" text-anchor="middle" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="58" font-weight="700" fill="#1D1D1F" letter-spacing="-1">
    Micro<tspan fill="url(#g4b)" font-weight="800">SIS</tspan>
  </text>
  <text x="250" y="380" text-anchor="middle" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="500" fill="#6E6E73" letter-spacing="4">
    INTELLIGENT SOLUTIONS, TOGETHER
  </text>

  <text x="250" y="470" text-anchor="middle" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#AAAAAA">
    CONCEPT 4 — INFINITY TEAM
  </text>
</svg>
