<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="g3a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0071E3"/>
      <stop offset="100%" style="stop-color:#00C6FF"/>
    </linearGradient>
    <linearGradient id="g3b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5856D6"/>
      <stop offset="100%" style="stop-color:#00C6FF"/>
    </linearGradient>
  </defs>

  <rect width="500" height="500" fill="#FFFFFF"/>

  <g transform="translate(250,185)">
    <!-- Main hexagon outline -->
    <polygon points="0,-85 74,-42.5 74,42.5 0,85 -74,42.5 -74,-42.5" 
             fill="none" stroke="url(#g3a)" stroke-width="3" opacity="0.25"/>

    <!-- 6 team member nodes at each hexagon vertex -->
    <!-- Top -->
    <circle cx="0" cy="-85" r="18" fill="url(#g3a)" opacity="0.9"/>
    <circle cx="0" cy="-92" r="7" fill="#FFF" opacity="0.9"/>
    <rect x="-9" y="-82" width="18" height="12" rx="4" fill="#FFF" opacity="0.7"/>

    <!-- Top-right -->
    <circle cx="74" cy="-42.5" r="18" fill="#0071E3" opacity="0.75"/>
    <circle cx="74" cy="-49.5" r="7" fill="#FFF" opacity="0.9"/>
    <rect x="65" y="-39.5" width="18" height="12" rx="4" fill="#FFF" opacity="0.7"/>

    <!-- Bottom-right -->
    <circle cx="74" cy="42.5" r="18" fill="#00C6FF" opacity="0.75"/>
    <circle cx="74" cy="35.5" r="7" fill="#FFF" opacity="0.9"/>
    <rect x="65" y="45.5" width="18" height="12" rx="4" fill="#FFF" opacity="0.7"/>

    <!-- Bottom -->
    <circle cx="0" cy="85" r="18" fill="url(#g3b)" opacity="0.9"/>
    <circle cx="0" cy="78" r="7" fill="#FFF" opacity="0.9"/>
    <rect x="-9" y="88" width="18" height="12" rx="4" fill="#FFF" opacity="0.7"/>

    <!-- Bottom-left -->
    <circle cx="-74" cy="42.5" r="18" fill="#5856D6" opacity="0.75"/>
    <circle cx="-74" cy="35.5" r="7" fill="#FFF" opacity="0.9"/>
    <rect x="-83" y="45.5" width="18" height="12" rx="4" fill="#FFF" opacity="0.7"/>

    <!-- Top-left -->
    <circle cx="-74" cy="-42.5" r="18" fill="#0071E3" opacity="0.85"/>
    <circle cx="-74" cy="-49.5" r="7" fill="#FFF" opacity="0.9"/>
    <rect x="-83" y="-39.5" width="18" height="12" rx="4" fill="#FFF" opacity="0.7"/>

    <!-- Internal connections (mesh network) -->
    <line x1="0" y1="-85" x2="74" y2="42.5" stroke="url(#g3a)" stroke-width="1" opacity="0.15"/>
    <line x1="0" y1="-85" x2="-74" y2="42.5" stroke="url(#g3a)" stroke-width="1" opacity="0.15"/>
    <line x1="74" y1="-42.5" x2="-74" y2="42.5" stroke="url(#g3a)" stroke-width="1" opacity="0.12"/>
    <line x1="-74" y1="-42.5" x2="74" y2="42.5" stroke="url(#g3a)" stroke-width="1" opacity="0.12"/>
    <line x1="74" y1="-42.5" x2="0" y2="85" stroke="url(#g3a)" stroke-width="1" opacity="0.15"/>
    <line x1="-74" y1="-42.5" x2="0" y2="85" stroke="url(#g3a)" stroke-width="1" opacity="0.15"/>

    <!-- Center AI core -->
    <circle cx="0" cy="0" r="22" fill="url(#g3a)" opacity="0.12"/>
    <circle cx="0" cy="0" r="12" fill="url(#g3a)" opacity="0.3"/>
    <text x="0" y="5" text-anchor="middle" font-family="'Inter',sans-serif" font-size="12" font-weight="800" fill="#FFF" opacity="0.9">AI</text>
  </g>

  <!-- Text -->
  <text x="250" y="355" text-anchor="middle" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="58" font-weight="700" fill="#1D1D1F" letter-spacing="-1">
    Micro<tspan fill="url(#g3a)" font-weight="800">SIS</tspan>
  </text>
  <text x="250" y="385" text-anchor="middle" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="500" fill="#6E6E73" letter-spacing="4">
    INTELLIGENT SOLUTIONS, TOGETHER
  </text>

  <text x="250" y="470" text-anchor="middle" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#AAAAAA">
    CONCEPT 3 — HEXAGON NETWORK
  </text>
</svg>
